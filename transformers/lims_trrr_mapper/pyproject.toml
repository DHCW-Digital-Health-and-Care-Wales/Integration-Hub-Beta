[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-trrr-mapper"
version = "0.1.0"
description = "Maps LIMS ADT A31/A40 messages to TRRR stored procedure requests"
requires-python = ">=3.13"

dependencies = [
  "azure-core>=1.38.0",
  "azure-servicebus==7.14.3",
  "azure-identity==1.23.0",
  "message-bus-lib",
  "health-check-lib",
  "processor-manager-lib",
  "event-logger-lib",
  "metric-sender-lib",
  "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
  "ruff==0.14.9",
  "bandit==1.9.2",
  "mypy==1.18.2",
]

[tool.uv.sources]
message-bus-lib = { path = "../../shared_libs/message_bus_lib" }
health-check-lib = { path = "../../shared_libs/health_check_lib" }
processor-manager-lib = { path = "../../shared_libs/processor_manager_lib" }
event-logger-lib = { path = "../../shared_libs/event_logger_lib" }
metric-sender-lib = { path = "../../shared_libs/metric_sender_lib" }

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "A",
  "PLC",
  "PLE",
  "PLW",
  "I",
]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/*_test.py"]
