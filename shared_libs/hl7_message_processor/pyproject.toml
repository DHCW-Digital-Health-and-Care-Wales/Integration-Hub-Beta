[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7_message_processor_lib"
version = "0.1.0"
description = "Version + message-structure aware HL7 v2 ER7<->XML conversion and XSD validation"
authors = [{name = "DHCW"}]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "defusedxml==0.7.1",
  "hl7apy==1.3.5",
  "xmlschema==3.4.3",
  "field-utils-lib",
]

[dependency-groups]
dev = [
  "ruff==0.14.9",
  "bandit==1.9.2",
  "mypy==1.18.2",
]

[tool.uv.sources]
field-utils-lib = { path = "../field_utils_lib" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hl7_message_processor*"]

[tool.setuptools.package-data]
hl7_message_processor = ["schemas/**/*.xsd", "custom_schemas/**/*.xsd"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E",  # Enforces style guide rules (Pycodestyle errors).
  "F",  # Detects various errors in Python code (Pyflakes errors).
  "W",  # Enforces style guide warnings (Pycodestyle warnings).
  "A",  # Detects shadowing of Python built-in functions (Flake8-builtins).
  "PLC",  # Enforces coding conventions (Pylint convention messages).
  "PLE",  # Detects errors in Python code (Pylint error messages).
  "PLW",  # Detects potential issues in Python code (Pylint warning messages).
  "I"  # Sorts and organizes imports (Import-related rules).
]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/*_test.py"]
