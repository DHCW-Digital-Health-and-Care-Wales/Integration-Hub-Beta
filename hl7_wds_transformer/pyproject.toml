[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7-wds-transformer"
version = "0.1.0"
description = "HL7v2 WDS filter/pass-through transformer for WIS delivery"
requires-python = ">=3.13"

dependencies = [
  "azure-core>=1.38.0",
  "azure-servicebus==7.14.3",
  "azure-identity==1.23.0",
  "cryptography>=50.0.0",
  "pyjwt>=2.13.0",
  "hl7apy==1.3.5",
  "urllib3>=2.6.3",
  "field-utils-lib",
  "transformer-base-lib",
  "message-bus-lib",
  "health-check-lib",
  "processor-manager-lib",
  "event-logger-lib",
  "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
  "ruff==0.14.9",
  "bandit==1.9.2",
  "mypy==1.18.2",
  "pytest>=8.3.0",
]

[tool.uv.sources]
field-utils-lib       = { path = "../shared_libs/field_utils_lib" }
transformer-base-lib  = { path = "../shared_libs/transformer_base_lib" }
message-bus-lib       = { path = "../shared_libs/message_bus_lib" }
health-check-lib      = { path = "../shared_libs/health_check_lib" }
processor-manager-lib = { path = "../shared_libs/processor_manager_lib" }
event-logger-lib      = { path = "../shared_libs/event_logger_lib" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hl7_wds_transformer*"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "A", "PLC", "PLE", "PLW", "I"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/*_test.py"]
