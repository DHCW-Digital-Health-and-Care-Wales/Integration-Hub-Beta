<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Queue Browser{% endblock %} — BusWatch</title>

  <!-- Apply saved theme before CSS loads to prevent a flash; shares the dashboard's key. -->
  <script>(function(){try{var t=localStorage.getItem('ih-theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('ih-loading');}catch(e){}})()</script>

  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/vendor/inter/inter.css" />
  <link rel="stylesheet" href="/static/css/buswatch.css" />

  {% block head %}{% endblock %}
</head>
<body>

<div id="page-load-bar"></div>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid gap-3">
    <a class="navbar-brand" href="/">
      <img src="/static/DHCW-logo-RGB-White.png" alt="DHCW" style="height:44px;width:auto;display:block;" />
      <span class="brand-title">BusWatch</span>
    </a>

    <button class="navbar-toggler border-0 text-white" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-5"></i>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% block nav_queues_active %}{% endblock %}" href="/">
            <i class="bi bi-stack"></i> Queues
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        <div id="live-indicator"><i class="bi bi-arrow-repeat"></i> Updated</div>
        <button id="theme-toggle" class="nav-icon-btn" type="button" title="Toggle light/dark theme">
          <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="dash-footer">
  NHS Wales — BusWatch &nbsp;|&nbsp; Azure Service Bus queue browser &nbsp;|&nbsp; <span id="footer-time"></span>
</footer>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
  (function () {
    var el = document.getElementById("footer-time");
    function tick() {
      if (el) el.textContent = new Date().toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "medium" });
    }
    tick();
    setInterval(tick, 1000);
  })();

  (function () {
    var html = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    var icon = document.getElementById("theme-icon");
    function apply(t) {
      html.setAttribute("data-theme", t);
      try { localStorage.setItem("ih-theme", t); } catch (e) {}
      if (icon) icon.className = t === "dark" ? "bi bi-moon-stars-fill" : "bi bi-sun-fill";
    }
    apply(html.getAttribute("data-theme") || "dark");
    if (btn) btn.addEventListener("click", function () {
      apply(html.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  })();

  // Show the navigation bar for internal page loads, mirroring the dashboard.
  (function () {
    var bar = document.getElementById("page-load-bar");
    if (!bar) return;
    document.addEventListener("click", function (e) {
      var link = e.target.closest("a[href]");
      if (!link) return;
      var href = link.getAttribute("href") || "";
      if (!href || href.startsWith("#") || href.startsWith("javascript") ||
          href.startsWith("http://") || href.startsWith("https://") ||
          href.startsWith("blob:") || href.startsWith("data:") ||
          link.hasAttribute("download") || link.target === "_blank" ||
          e.ctrlKey || e.metaKey || e.shiftKey) return;
      bar.classList.add("loading");
    });
    document.addEventListener("submit", function (e) {
      if (!e.defaultPrevented) bar.classList.add("loading");
    });
    // Clear when restored from the back/forward cache.
    window.addEventListener("pageshow", function () { bar.classList.remove("loading"); });
  })();

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      document.documentElement.classList.remove("ih-loading");
    });
  });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
