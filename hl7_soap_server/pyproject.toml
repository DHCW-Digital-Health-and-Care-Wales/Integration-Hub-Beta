[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7-soap-server"
version = "0.1.0"
description = "SOAP endpoint for HL7v2 XML ingestion"
requires-python = ">=3.13"

dependencies = [
    "azure-core>=1.38.0",
    "azure-servicebus==7.14.3",
    "azure-identity==1.23.0",
    "pyjwt>=2.13.0",
    "hl7apy==1.3.5",
    "urllib3>=2.6.3",
    "hishel==1.1.8",
    "idna>=3.15",
    "pygments>=2.20.0",
    "msgpack>=1.1.3",
    "defusedxml==0.7.1",
    "cryptography>=50.0.0",
    "spyne>=2.14.0",
    "lxml>=5.3.0",
    "otel-lib",
    "message-bus-lib",
    "health-check-lib",
    "hl7_validation_lib",
    "event-logger-lib",
    "metric-sender-lib",
    "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.14.9",
    "bandit==1.9.2",
    "mypy==1.18.2",
]

[tool.uv.sources]
message-bus-lib = { path = "../shared_libs/message_bus_lib" }
otel-lib = { path = "../shared_libs/otel_lib" }
health-check-lib = { path = "../shared_libs/health_check_lib" }
hl7_validation_lib = { path = "../shared_libs/hl7_validation" }
event-logger-lib = { path = "../shared_libs/event_logger_lib" }
metric-sender-lib = { path = "../shared_libs/metric_sender_lib" }

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "A",
    "PLC",
    "PLE",
    "PLW",
    "I",
]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/*_test.py"]
