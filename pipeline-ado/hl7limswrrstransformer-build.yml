# HL7 LIMS WRRS Transformer Build Pipeline
trigger:
  branches:
    include:
      - main
      - release-*
  paths:
    include:
      - transformers/hl7_lims_wrrs_transformer/**
      - shared_libs/**
      - pipeline-ado/templates/**
      - ca-certs/**

pr: none

parameters:
  - name: SEMANTIC_VERSION
    displayName: 'Semantic Version'
    type: string
    default: 'v0.1.0'

variables:
  acrName: 'uksdhcwihsharedcr'
  azureServiceConnection: 'Azure - NHSWales-DHCW-IntegrationHub-Subscription'
  POOL_NAME: 'UKS-DHCW-IH-DEV-ADOManagedPool'

stages:
  - stage: CodeQuality
    displayName: 'Code Quality & Tests'
    jobs:
      - template: templates/code-quality-template.yml
        parameters:
          appName: 'transformers/hl7_lims_wrrs_transformer'
          appDisplayName: 'LIMS WRRS HL7 Transformer'
          pythonVersion: '3.13'
          poolName: ${{ variables.POOL_NAME }}

  - stage: BuildAndPushHL7LimsWrrsTransformer
    displayName: 'Build and Push HL7 LIMS WRRS Transformer'
    dependsOn: CodeQuality
    jobs:
      - template: templates/docker-build-push-template.yml
        parameters:
          jobName: 'BuildPushHL7LimsWrrsTransformer'
          displayName: 'Build and Push HL7 LIMS WRRS Transformer'
          appName: 'lims-wrrs-hl7transformer'
          dockerfilePath: 'transformers/hl7_lims_wrrs_transformer/Dockerfile'
          buildContext: 'transformers/hl7_lims_wrrs_transformer'
          additionalContexts: 'shared_libs=shared_libs,ca-certs=ca-certs'
          acrName: $(acrName)
          azureServiceConnection: $(azureServiceConnection)
          POOL_NAME: ${{ variables.POOL_NAME }}
          SEMANTIC_VERSION: ${{ parameters.SEMANTIC_VERSION }}
