# Lookup Service Build Pipeline
trigger:
  branches:
    include:
      - main
      - release-*
  paths:
    include:
      - lookup_service/**
      - shared_libs/**
      - pipeline-ado/templates/**
      - ca-certs/**

pr: none

parameters:
  - name: SEMANTIC_VERSION
    displayName: 'Semantic Version'
    type: string
    default: 'v0.1.0'

variables:
  acrName: 'uksdhcwihsharedcr'
  azureServiceConnection: 'Azure - NHSWales-DHCW-IntegrationHub-Subscription'
  POOL_NAME: 'UKS-DHCW-IH-DEV-ADOManagedPool'

stages:
  - stage: CodeQuality
    displayName: 'Code Quality & Tests'
    jobs:
      - template: templates/code-quality-template.yml
        parameters:
          appName: 'lookup_service'
          appDisplayName: 'Lookup Service'
          pythonVersion: '3.13'
          poolName: ${{ variables.POOL_NAME }}

  - stage: BuildAndPushLookupService
    displayName: 'Build and Push Lookup Service'
    dependsOn: CodeQuality
    jobs:
      - template: templates/docker-build-push-template.yml
        parameters:
          jobName: 'BuildPushLookupService'
          displayName: 'Build and Push Lookup Service'
          appName: 'lookup-service'
          dockerfilePath: 'lookup_service/Dockerfile'
          buildContext: 'lookup_service'
          # Dockerfile only uses the ca-certs context; the service has no shared_libs dependency.
          additionalContexts: 'ca-certs=ca-certs'
          acrName: $(acrName)
          azureServiceConnection: $(azureServiceConnection)
          POOL_NAME: ${{ variables.POOL_NAME }}
          SEMANTIC_VERSION: ${{ parameters.SEMANTIC_VERSION }}
