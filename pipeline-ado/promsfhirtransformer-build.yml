# PROMS FHIR Transformer Build Pipeline
trigger:
  branches:
    include:
      - main
      - release-*
  paths:
    include:
      - transformers/xml_fhir_proms_transformer/**
      - shared_libs/**
      - pipeline-ado/templates/**
      - ca-certs/**

pr: none

parameters:
  - name: SEMANTIC_VERSION
    displayName: 'Semantic Version'
    type: string
    default: 'v0.1.0'

variables:
  acrName: 'uksdhcwihsharedcr'
  azureServiceConnection: 'Azure - NHSWales-DHCW-IntegrationHub-Subscription'
  POOL_NAME: 'UKS-DHCW-IH-DEV-ADOManagedPool'

stages:
  - stage: CodeQuality
    displayName: 'Code Quality & Tests'
    jobs:
      - template: templates/code-quality-template.yml
        parameters:
          appName: 'transformers/xml_fhir_proms_transformer'
          appDisplayName: 'PROMS FHIR Transformer'
          pythonVersion: '3.13'
          poolName: ${{ variables.POOL_NAME }}

  - stage: BuildAndPushPromsFhirTransformer
    displayName: 'Build and Push PROMS FHIR Transformer'
    dependsOn: CodeQuality
    jobs:
      - template: templates/docker-build-push-template.yml
        parameters:
          jobName: 'BuildPushPromsFhirTransformer'
          displayName: 'Build and Push PROMS FHIR Transformer'
          appName: 'proms-fhirtransformer'
          dockerfilePath: 'transformers/xml_fhir_proms_transformer/Dockerfile'
          buildContext: 'transformers/xml_fhir_proms_transformer'
          additionalContexts: 'shared_libs=shared_libs,ca-certs=ca-certs'
          acrName: $(acrName)
          azureServiceConnection: $(azureServiceConnection)
          POOL_NAME: ${{ variables.POOL_NAME }}
          SEMANTIC_VERSION: ${{ parameters.SEMANTIC_VERSION }}
