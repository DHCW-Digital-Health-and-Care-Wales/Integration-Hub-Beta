# HTTP Mock Receiver Build Pipeline
trigger:
  branches:
    include:
      - main
      - release-*
  paths:
    include:
      - mock_receivers/http_mock_receiver/**
      - shared_libs/**
      - pipeline-ado/templates/**
      - ca-certs/**

pr: none

parameters:
  - name: SEMANTIC_VERSION
    displayName: 'Semantic Version'
    type: string
    default: 'v0.1.0'

variables:
  acrName: 'uksdhcwihsharedcr'
  azureServiceConnection: 'Azure - NHSWales-DHCW-IntegrationHub-Subscription'
  POOL_NAME: 'UKS-DHCW-IH-DEV-ADOManagedPool'

stages:
  - stage: CodeQuality
    displayName: 'Code Quality & Tests'
    jobs:
      - template: templates/code-quality-template.yml
        parameters:
          appName: 'mock_receivers/http_mock_receiver'
          appDisplayName: 'HTTP Mock Receiver'
          pythonVersion: '3.13'
          poolName: ${{ variables.POOL_NAME }}

  - stage: BuildAndPushHTTPMockReceiver
    displayName: 'Build and Push HTTP Mock Receiver'
    dependsOn: CodeQuality
    jobs:
      - template: templates/docker-build-push-template.yml
        parameters:
          jobName: 'BuildPushHTTPMockReceiver'
          displayName: 'Build and Push HTTP Mock Receiver'
          appName: 'httpmockreceiver'
          dockerfilePath: 'mock_receivers/http_mock_receiver/Dockerfile'
          buildContext: 'mock_receivers/http_mock_receiver'
          additionalContexts: "shared_libs=shared_libs,ca-certs=ca-certs"
          acrName: $(acrName)
          azureServiceConnection: $(azureServiceConnection)
          POOL_NAME: ${{ variables.POOL_NAME }}
          SEMANTIC_VERSION: ${{ parameters.SEMANTIC_VERSION }}
